name: "CI: Build and Run Light Smoke Tests"
description: "Builds the plugin files using the git tags for versioning and for generation logs using conventional commits. Build guarantees the wp plugin check passes and by default it runs your playwright smoke tests."
on: 
  workflow_call:
    inputs:
      plugin-slug:
        required: true
        type: string
        description: "The WordPress plugin slug used by wp-env for plugin-check and the e2e tests"
      upload-build:
        required: false
        type: boolean
        default: false
        description: Uploads build as artifact only when all steps ran successfully
      run-playwright-tests:
        required: false
        type: boolean
        default: true
        description: Run the playwright e2e smoke tests (light)
      run-phpunit-tests:
        required: false
        type: boolean
        default: true
        description: "Run the WordPress PHPUnit integration tests. you'll need these composer scripts: test:install and test:ci"
      php-version-build:
          required: false
          type: string
          default: '8.4' 
          description: "PHP version used to build the plugin files (edp-build)"
      php-version-lint:
        required: false
        type: string
        default: '8.4' 
        description: "PHP version used to lint the built plugin files"
      php-version-tests-end:
        required: false
        type: string
        default: 'latest' 
        description: "PHP version used to run the e2e tests, this includes the plugin check tests"
      

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    # ==============================================================================
    #  Set if we have changed PHP files
    # ==============================================================================
    set-php-has-changes:
      name: Check for PHP file changes
      runs-on: ubuntu-latest
      outputs:
        has_php: ${{ steps.php-changes.outputs.php }}
      steps:
        - uses: actions/checkout@v4
        - uses: dorny/paths-filter@v3
          id: php-changes
          with:
            filters: |
              php:
                - '**/*.php'
    # ==============================================================================
    #  Then only check for syntax errors on changed PHP files
    # ==============================================================================    
    check-php-changed-files:
        name: Ensure changed PHP files are valid across all supported PHP versions.
        needs: set-php-has-changes
        if: needs.set-php-has-changes.outputs.has_php == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                # php-version: [7.4, 8.0, 8.1, 8.2, 8.3, 8.4, 8.5] 
                php-version: [7.4, 8.5] # to save us some compute and time we'll only run against these versions. They run in parallel but still they can take more wall-clock time  regardless.
        steps:
            # ------------------------------------------------
            #  setup...
            # ------------------------------------------------
            - uses: actions/checkout@v6

            - name: Setup PHP Action
              uses: shivammathur/setup-php@2.37.2
              with: 
                php-version: ${{ matrix.php-version }}
                coverage: none

            # --------  set changed files --------
            - name: Set changed PHP files
              id: changed-php-files
              uses: tj-actions/changed-files@v47.0.6
              with: 
                files: |
                    **.php
            # ------------------------------------------------
            #  Run the actual lint checks!
            # ------------------------------------------------
            #- run: echo "${{ steps.changed-php-files.outputs.all_changed_files }}"
            - name: Check changed files syntax
              run: |
                for file in ${{ steps.changed-php-files.outputs.all_changed_files }}; do
                    [ -f "$file" ] && php -l "$file"
                done
    # ==============================================================================
    #  PHPUnit Integration Tests (PHP 7.4)
    # ==============================================================================
    phpunit-tests:
      name: Run PHPUnit Tests
      needs: set-php-has-changes
      permissions:
        contents: read # so that we can checkout
        actions: write   # this so that we may cancel all runs on fail
      if: inputs.run-phpunit-tests && needs.set-php-has-changes.outputs.has_php == 'true'
      runs-on: ubuntu-latest
      services:
        mysql:
          image: mariadb:10.11
          env:
            MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          ports:
            - 3306:3306
          options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

      steps:
        - uses: actions/checkout@v4

        # -------------------------------------------------------------
        # Boot PHP 85 for the pre-test hook. This is so that any tools (like global tools) can install using modern php.
        # -------------------------------------------------------------
        - name: Setup PHP 8.5 for Scoping
          uses: shivammathur/setup-php@2.37.2
          with:
            php-version: '8.5'
            coverage: none

        - name: Run before tests
          run: |
            if composer | grep -q pre-test; then
              composer run pre-test
            fi
        # back to target 74 for the tests runtime
        - name: Setup PHP 7.4
          uses: shivammathur/setup-php@2.37.2
          with:
            php-version: '7.4'
            extensions: mysql, mysqli, pdo_mysql, mbstring, xml, curl
            coverage: none

        # bin/install-wp-tests.sh uses SVN to download wordpress-tests-lib
        # (Ubuntu runners no longer include subversion by default)
        - name: Install Subversion
          run: |
            sudo apt-get update -q
            sudo apt-get install -y subversion

        - name: Make install script executable
          run: chmod +x bin/install-wp-tests.sh
        
          # run the installation script
        - name: Install WP Test Suite & PHPUnit Dependencies
          run: composer run test:install

        # Now for the actual meat: run the tests!
        - name: Run PHPUnit
          run: |
            composer run test:ci
        # oh, no! tests failed! so let's bail from the other jawbs too!
        - name: Cancel all jobs on failure
          if: failure()
          env:
            GH_TOKEN: ${{ github.token }}
          run: gh run cancel ${{ github.run_id }} --force || true
    # ==============================================================================
    #  Now lets build the initial artifact, without compiling js 
    # ==============================================================================
    initial-build:
      timeout-minutes: 15 # dont go over 15 minutes. the fact that you're over 10 means something is wrong but lets give it a little window so that we dont interrupt this at exactly 10 minutes but make sure if something is stuck in one of the steps it doesnt go on forever eating all our allocated minutes.
      runs-on: ubuntu-latest
      permissions:
        contents: write  # for github-pages-deploy-action
        actions: write
      needs: check-php-changed-files
      if: always() && (needs.check-php-changed-files.result == 'success' || needs.check-php-changed-files.result == 'skipped')
      steps:
        # ==============================================================================
        #  Setup the env...
        # ==============================================================================
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        # --------  add the local bin to path --------
        - name: Add ~/.local/bin to the path PATH, used by some deps bellow
          run: echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        # --------  Install versions finder, this is used by: header-injector and the set-versions step. --------
        - name: Install versions-finder
          run: |
            curl -L https://raw.githubusercontent.com/neblabs/versions-finder/main/install.sh | bash
            # fails if not found
            command -v versions-finder

        # --------  set wp and plugin versions to use (latest) --------
        - name: Set WP and plugin versions to use
          id: set-versions
          run: |
            echo "wpVersion=$(curl -s https://api.wordpress.org/core/version-check/1.7/ | jq -r '.offers[0].version')" >> $GITHUB_OUTPUT
            echo "pluginVersion=$(versions-finder any --latest --output-strict-semver)" >> $GITHUB_OUTPUT

        # ------------------------------------------------
        #  Switch to target PHP version for building
        # ------------------------------------------------
        - name: Switch PHP for building
          uses: shivammathur/setup-php@2.37.2
          with:
            php-version: ${{ inputs.php-version-build }}
            coverage: none

        # ------------------------------------------------
        #  lets build the js
        # ------------------------------------------------
        - name: Install js deps
          run: composer run install-scripts-ci
        
        - name: Build js
          run: composer run build-scripts
        # ------------------------------------------------
        #  Install the composer deps before running the builder
        # ------------------------------------------------
        - name: Install PHP Dependencies with Composer
          uses: ramsey/composer-install@4.0.0
          with:
            composer-options: "--optimize-autoloader"
        # ------------------------------------------------
        #  create base initial build, lacks some transformations
        # ------------------------------------------------
        - name: Run before edp build
          run: |
            if composer | grep -q pre-build; then
              composer run pre-build
            fi
        - name: Run the edp builder
          id: edp-build
          run: |
            chmod u+x ./edp
            [[ -f edp-shell ]] && chmod u+x ./edp-shell

            # Route PHP errors to stderr and capture raw stdout
            rawOutput=$(php -d display_errors=stderr \
                            -d error_reporting="E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED & ~E_WARNING & ~E_NOTICE" \
                            ./edp build --target "$RUNNER_TEMP/build" --silent)
            exitCode=$?

            # Get the last line which should be the dir. This ignores any prev output for when the build script generated more output than wanted. The last non whitespace line should be the one with the dir
            buildDir=$(echo "$rawOutput" | grep -E '\w+' | tail -n 1)

            if [ $exitCode -ne 0 ] || [ -z "$buildDir" ]; then
              echo "Error: EDP build failed with exit code $exitCode." >&2
              echo "Output captured in stdout was: $rawOutput" >&2
              exit 1
            fi

            echo "buildDir=$buildDir" >> "$GITHUB_OUTPUT"        
        - name: Deploy inital build to branch for inspecting 
          uses: JamesIves/github-pages-deploy-action@v4
          with:
            folder: ${{ steps.edp-build.outputs.buildDir }}
            branch: build-preview-pr-initial-build-${{ github.event.number }}-${{ github.run_id }}
        # ------------------------------------------------
        #  Switch to PHP 84 since these tools require that
        # ------------------------------------------------
        - name: Switch PHP for the tools
          uses: shivammathur/setup-php@2.37.2
          with:
            php-version: '8.4'
            coverage: none
        # ------------------------------------------------
        #  Inject the headers into the build
        # ------------------------------------------------
        - name: Inject headers data
          run: |
            curl -L https://raw.githubusercontent.com/neblabs/header-injector/main/bin/install.sh | bash
            # fails if not found
            command -v header-injector
            set -e

            header-injector inject "${{ steps.edp-build.outputs.buildDir }}" "${{ steps.edp-build.outputs.buildDir }}" "${{ steps.set-versions.outputs.wpVersion }}" --cleanup > /tmp/out.txt

            echo "Exit code: $?"
            echo "Bytes written: $(wc -c < /tmp/out.txt)"
            echo header-injector inject output:
            cat /tmp/out.txt

            mapfile -t files < /tmp/out.txt

            phpFile="${files[0]}"
            readmeFile="${files[1]}"
            
            
            #validate it
            header-injector validate "$phpFile" "$readmeFile" "${{ steps.set-versions.outputs.wpVersion }}" --git-source .
        
        # ------------------------------------------------
        #  Now for the changelog
        # ------------------------------------------------
        # --------  lets setup git cliff here so that if something failed earlier we are not wasting extra time. --------
        - name: Set up git-cliff
          uses: kenji-miyake/setup-git-cliff@v1

        - name: Inject changelog data
          env: 
            EVENT_NAME: ${{ github.event_name }}
          run: |
            curl -L https://raw.githubusercontent.com/neblabs/wp-changelog-injector/main/install.sh | bash
            
            # fails if not found
            command -v wp-changelog-injector

            # on pull request get the changelog from the latest tag instead of the previous which is for on tags push.
            if [ "$EVENT_NAME" = "pull_request" ]; then
              # this flag is passed to wp-changelog-injector
              maybeLatest=--latest
            fi

            # updated to new version
            bash -x wp-changelog-injector --readme "${{ steps.edp-build.outputs.buildDir }}"/readme.md $maybeLatest # maybeLatest must be unquoted so that nothing is passed. doing "$maybeLatest" will pass a literal empty string when this isn't set. and this is a bool option so we ain't want to pass it when unset.
            
        # ------------------------------------------------
        #  Save it to a new tmp branch for testing 
        # ------------------------------------------------
        - name: Deploy build output to dynamic preview branch
          uses: JamesIves/github-pages-deploy-action@v4
          with:
            folder: ${{ steps.edp-build.outputs.buildDir }}
            branch: build-preview-pr-${{ github.event.number }}-${{ github.run_id }}
        # ------------------------------------------------
        #  Switch to target PHP version for linting
        # ------------------------------------------------
        - name: Switch PHP for linting
          uses: shivammathur/setup-php@2.37.2
          with:
            php-version: ${{ inputs.php-version-lint }}
            coverage: none
        # --------  We have to lint all files even those we don't own because the wp repo will reject them on svn commit if they have linting errors so yeah better early than later --------
        - name: "Lint PHP files in build dir"
          run: |
            echo "::group::linting EVERY SINGLE php file in the build"
            lintOutput=$(mktemp)
            if ! find ${{ steps.edp-build.outputs.buildDir }} -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > "$lintOutput" 2>&1; then
              echo "PHP lint failed -- see errors below:"
              grep -v "No syntax errors detected" "$lintOutput"
              rm -f "$lintOutput"
              exit 1
            fi
            rm -f "$lintOutput"
            echo "Lint OK."
            echo "::endgroup::"
        # ------------------------------------------------
        #  Switch to target PHP version for testing
        # ------------------------------------------------
        - name: Switch PHP for testing
          uses: shivammathur/setup-php@2.37.2
          with:
            php-version: ${{ inputs.php-version-tests-end }}
            coverage: none
        # ------------------------------------------------
        #  Now the plugin check tests
        # ------------------------------------------------
        - name: Create wp-env config overrides
          run: |
            phpVersion="$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
            cat << EOF > .wp-env.override.json
            {
              "core": "https://wordpress.org/wordpress-${{ steps.set-versions.outputs.wpVersion }}.zip",
              "phpVersion": "$phpVersion",
              "config": {
                "WP_DEBUG": true,
                "WP_DEBUG_DISPLAY": false,
                "WP_DEBUG_LOG": true
              }
            }
            EOF

        - name: Cache wp-env assets by WP version
          uses: actions/cache@v4
          with:
            path: ~/.wp-env
            key: wp-env-${{ runner.os }}-wp-${{ steps.set-versions.outputs.wpVersion }}
            restore-keys: |
              wp-env-${{ runner.os }}-wp-

        - name: Run plugin check
          uses: wordpress/plugin-check-action@v1
          with:
            repo-token: ${{ github.token }}
            build-dir: ${{ steps.edp-build.outputs.buildDir }}
            slug: ${{ inputs.plugin-slug }}
            ignore-codes: |
              stable_tag_mismatch

        # ------------------------------------------------
        #  Finally run the e2e smoke tests and we're done
        # ------------------------------------------------
        # --------  but before that, lets make sure the ports are working as expected --------
        - name: Extract wp env url and check network for playwright tests
          id: wp-env-network
          run: |
            # Restrict lookup strictly to wp-env's CLI container
            CLI_CONTAINER=$(docker ps -q \
              --filter "label=com.docker.compose.service=cli" \
              --filter "name=wp-env")

            if [ -z "$CLI_CONTAINER" ]; then
              echo "ERROR: Could not find wp-env CLI container" >&2
              exit 1
            fi

            # Fetch siteurl directly from the DB
            wpBaseURL=$(docker exec "$CLI_CONTAINER" wp option get siteurl)

            if [ -z "$wpBaseURL" ]; then
              echo "ERROR: Failed to retrieve siteurl from WP-CLI" >&2
              exit 1
            fi
            
            # Export WP_BASE_URL for Playwright and all subsequent steps
            echo "WP_BASE_URL=$wpBaseURL" >> $GITHUB_OUTPUT

            echo using WP_BASE_URL = "$wpBaseURL"
            echo "=== Container & Port Mappings ==="
            dockerPorts=$(docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}")

            echo "Docker ports"
            cat <<<"$dockerPorts"

            echo "=== WordPress Port Health Check ==="
            curl -I --fail --connect-timeout 5 "$wpBaseURL" || { echo "wp base url: $wpBaseURL unreachable" 1>&2; exit 1; }
            curl -I --fail --connect-timeout 5 http://localhost:$WP_PORT || { echo "localhost (IPv6) unreachable" 1>&2; }
        # --------  now wp-env already sets up node but lets use this here for explicitness sake --------
        - uses: actions/setup-node@v6
          with:
            node-version: lts/*
            
        - name: Install dependencies
          run: npm ci --no-audit

        - name: Install Playwright Browsers
          run: npx playwright install chrome

        - name: Run Playwright tests
          # at the github-level, might increase when tests grow...
          timeout-minutes: 5
          run: npx playwright test e2e/smoke --reporter=github
          env:
            WP_BASE_URL: ${{ steps.wp-env-network.outputs.WP_BASE_URL }}
            PLUGIN_VERSION: ${{ steps.set-versions.outputs.pluginVersion }}
            DEBUG: pw:api

        # ------------------------------------------------
        #  so now lets build the artifact if the build succeeded.
        # ------------------------------------------------
        - name: Upload the Built Plugin Artifact on Success
          if: ${{ inputs.upload-build && !failure() }}
          uses: actions/upload-artifact@v7.0.1
          with:
            name: plugin-build
            path: ${{ steps.edp-build.outputs.buildDir }}
            retention-days: 3
            if-no-files-found: error

        - uses: actions/upload-artifact@v4
          if: ${{ !cancelled() }}
          with:
            name: playwright-report
            path: playwright-report/
            retention-days: 30
        - name: Upload test artifacts
          if: ${{ !cancelled() }}
          uses: actions/upload-artifact@v4
          with:
            name: test-results
            path: test-results/
            retention-days: 14
        - name: Dump WordPress debug log on failure
          if: failure()
          run: |
            CLI_CONTAINER=$(docker ps -q \
              --filter "label=com.docker.compose.service=cli" \
              --filter "name=wp-env")

            if [ -z "$CLI_CONTAINER" ]; then
              echo "CLI container not found" >&2
              exit 0
            fi

            echo "=== wp-content/debug.log ==="
            docker exec "$CLI_CONTAINER" cat wp-content/debug.log 2>/dev/null || echo "no debug.log found"
        # something failed so let's bail
        - name: Cancel all jobs on failure
          if: failure()
          env:
            GH_TOKEN: ${{ github.token }}
          run: gh run cancel ${{ github.run_id }} --force || true

name: CI Smoke Tests

on: 
  workflow_call:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    # ==============================================================================
    #  Set if we have changed PHP files
    # ==============================================================================
    set-php-has-changes:
      name: Check for PHP file changes
      runs-on: ubuntu-latest
      outputs:
        has_php: ${{ steps.php-changes.outputs.php }}
      steps:
        - uses: actions/checkout@v4
        - uses: dorny/paths-filter@v3
          id: php-changes
          with:
            filters: |
              php:
                - '**/*.php'
    # ==============================================================================
    #  Then only check for syntax errors on changed PHP files
    # ==============================================================================    
    check-php-changed-files:
        name: Ensure changed PHP files are valid across all supported PHP versions.
        needs: set-php-has-changes
        if: needs.set-php-has-changes.outputs.has_php == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                # php-version: [7.4, 8.0, 8.1, 8.2, 8.3, 8.4]
                php-version: [7.4]
        steps:
            # ------------------------------------------------
            #  setup...
            # ------------------------------------------------
            - uses: actions/checkout@v6

            - name: Setup PHP Action
              uses: shivammathur/setup-php@2.37.2
              with: 
                php-version: ${{ matrix.php-version }}
                coverage: none

            # --------  set changed files --------
            - name: Set changed PHP files
              id: changed-php-files
              uses: tj-actions/changed-files@v47.0.6
              with: 
                files: |
                    **.php
            # ------------------------------------------------
            #  Run the actual lint checks!
            # ------------------------------------------------
            #- run: echo "${{ steps.changed-php-files.outputs.all_changed_files }}"
            - name: Check changed files syntax
              run: |
                for file in ${{ steps.changed-php-files.outputs.all_changed_files }}; do
                    [ -f "$file" ] && php -l "$file"
                done
    # ==============================================================================
    #  Now lets build the initial artifact, without compiling js 
    # ==============================================================================
    initial-build:
      timeout-minutes: 15 # dont go over 15 minutes. the fact that you're over 10 means something is wrong but lets give it a little window so that we dont interrupt this at exactly 10 minutes but make sure if something is stuck in one of the steps it doesnt go on forever eating all our allocated minutes.
      runs-on: ubuntu-latest
      permissions:
        contents: write
      needs: check-php-changed-files
      if: always() && (needs.check-php-changed-files.result == 'success' || needs.check-php-changed-files.result == 'skipped')
      steps:
        # ==============================================================================
        #  Setup the env...
        # ==============================================================================
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        # --------  add the local bin to path --------
        - name: Add ~/.local/bin to the path PATH, used by some deps bellow
          run: echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        # --------  install php 8.4 --------
        - name: Setup PHP Action
          uses: shivammathur/setup-php@2.37.2
          with: 
            php-version: 8.4
            coverage: none
        
        # --------  set wp version to use (latest) --------
        - name: Set WP version to use
          id: wp-version
          run: |
            echo "wpVersion=$(curl -s https://api.wordpress.org/core/version-check/1.7/ | jq -r '.offers[0].version')" >> $GITHUB_OUTPUT
        
        # --------  Install versions finder --------
        - name: Install versions-finder
          run: |
            curl -L https://raw.githubusercontent.com/neblabs/versions-finder/main/install.sh | bash
            # fails if not found
            command -v versions-finder
          
        # ------------------------------------------------
        #  lets build the js
        # ------------------------------------------------
        - name: Install js deps
          run: composer run install-scripts-ci
        
        - name: Build js
          run: composer run build-scripts
        # ------------------------------------------------
        #  Install the composer deps before running the builder
        # ------------------------------------------------
        - name: Install PHP Dependencies with Composer
          uses: ramsey/composer-install@4.0.0
          with:
            composer-options: "--optimize-autoloader"
        # ------------------------------------------------
        #  create base initial build, lacks some transformations
        # ------------------------------------------------
        - name: Run before edp build
          run: |
            if composer | grep -q pre-build; then
              composer run pre-build
            fi
        - name: Run the edp builder
          id: edp-build
          run: |
            chmod u+x ./edp
            [[ -f edp-shell ]] && chmod u+x ./edp-shell

            # Route PHP errors to stderr and capture raw stdout
            rawOutput=$(php -d display_errors=stderr \
                            -d error_reporting="E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED & ~E_WARNING & ~E_NOTICE" \
                            ./edp build --target "$RUNNER_TEMP/build" --silent)
            exitCode=$?

            # Trim any accidental whitespace or newlines
            buildDir=$(echo "$rawOutput" | xargs)

            if [ $exitCode -ne 0 ] || [ -z "$buildDir" ]; then
              echo "Error: EDP build failed with exit code $exitCode." >&2
              echo "Output captured in stdout was: $rawOutput" >&2
              exit 1
            fi

            echo "buildDir=$buildDir" >> "$GITHUB_OUTPUT"        
        - name: Deploy inital build to branch for inspecting 
          uses: JamesIves/github-pages-deploy-action@v4
          with:
            folder: ${{ steps.edp-build.outputs.buildDir }}
            branch: build-preview-pr-initial-build-${{ github.event.number }}-${{ github.run_id }}
        # ------------------------------------------------
        #  Inject the headers into the build
        # ------------------------------------------------
        - name: Inject headers data
          run: |
            curl -L https://raw.githubusercontent.com/neblabs/header-injector/main/bin/install.sh | bash
            # fails if not found
            command -v header-injector
            set -e

            header-injector inject "${{ steps.edp-build.outputs.buildDir }}" "${{ steps.edp-build.outputs.buildDir }}" "${{ steps.wp-version.outputs.wpVersion }}" --cleanup > /tmp/out.txt

            echo "Exit code: $?"
            echo "Bytes written: $(wc -c < /tmp/out.txt)"
            echo header-injector inject output:
            cat /tmp/out.txt

            mapfile -t files < /tmp/out.txt

            phpFile="${files[0]}"
            readmeFile="${files[1]}"
            
            
            #validate it
            header-injector validate "$phpFile" "$readmeFile" "${{ steps.wp-version.outputs.wpVersion }}" --git-source .
        # ------------------------------------------------
        #  Now for the changelog
        # ------------------------------------------------
        # --------  lets setup git cliff here so that if something failed earlier we are not wasting extra time. --------
        - name: Set up git-cliff
          uses: kenji-miyake/setup-git-cliff@v1

        - name: Inject changelog data
          env: 
            EVENT_NAME: ${{ github.event_name }}
          run: |
            curl -L https://raw.githubusercontent.com/neblabs/wp-changelog-injector/main/install.sh | bash
            
            # fails if not found
            command -v wp-changelog-injector

            # on pull request get the changelog from the latest tag instead of the previous which is for on tags push.
            if [ "$EVENT_NAME" = "pull_request" ]; then
              # this flag is passed to wp-changelog-injector
              maybeLatest=--latest
            fi

            bash -x wp-changelog-injector --readme "${{ steps.edp-build.outputs.buildDir }}"/readme.md --changelog "${{ steps.edp-build.outputs.buildDir }}"/changelog.md $maybeLatest # maybeLatest must be unquoted so that nothing is passed. doing "$maybeLatest" will pass a literal empty string when this isn't set. and this is a bool option so we ain't want to pass it when unset.
            
        # ------------------------------------------------
        #  Save it to a new tmp branch for testing 
        # ------------------------------------------------
        - name: Deploy build output to dynamic preview branch
          uses: JamesIves/github-pages-deploy-action@v4
          with:
            folder: ${{ steps.edp-build.outputs.buildDir }}
            branch: build-preview-pr-${{ github.event.number }}-${{ github.run_id }}
        # ------------------------------------------------
        #  Now the plugin check tests
        # ------------------------------------------------
        - name: Create wp-env config overrides
          run: |
            cat << EOF > .wp-env.override.json
            {
              "core": "https://wordpress.org/wordpress-${{ steps.wp-version.outputs.wpVersion }}.zip",
              "config": {
                "WP_DEBUG": true,
                "WP_DEBUG_DISPLAY": false,
                "WP_DEBUG_LOG": true
              }
            }
            EOF

        - name: Cache wp-env assets by WP version
          uses: actions/cache@v4
          with:
            path: ~/.wp-env
            key: wp-env-${{ runner.os }}-wp-${{ steps.wp-version.outputs.wpVersion }}
            restore-keys: |
              wp-env-${{ runner.os }}-wp-

        - name: Run plugin check
          uses: wordpress/plugin-check-action@v1
          with:
            repo-token: ${{ github.token }}
            build-dir: ${{ steps.edp-build.outputs.buildDir }}
            slug: coupons-plus-for-woocommerce
            ignore-codes: |
              stable_tag_mismatch

        # ------------------------------------------------
        #  Finally run the e2e smoke tests and we're done
        # ------------------------------------------------
        # --------  but before that, lets make sure the ports are working as expected --------
        - name: Extract wp env url and check network for playwright tests
          id: wp-env-network
          run: |
            # Restrict lookup strictly to wp-env's CLI container
            CLI_CONTAINER=$(docker ps -q \
              --filter "label=com.docker.compose.service=cli" \
              --filter "name=wp-env")

            if [ -z "$CLI_CONTAINER" ]; then
              echo "ERROR: Could not find wp-env CLI container" >&2
              exit 1
            fi

            # Fetch siteurl directly from the DB
            wpBaseURL=$(docker exec "$CLI_CONTAINER" wp option get siteurl)

            if [ -z "$wpBaseURL" ]; then
              echo "ERROR: Failed to retrieve siteurl from WP-CLI" >&2
              exit 1
            fi
            
            # Export WP_BASE_URL for Playwright and all subsequent steps
            echo "WP_BASE_URL=$wpBaseURL" >> $GITHUB_OUTPUT

            echo using WP_BASE_URL = "$wpBaseURL"
            echo "=== Container & Port Mappings ==="
            dockerPorts=$(docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}")

            echo "Docker ports"
            cat <<<"$dockerPorts"

            echo "=== WordPress Port Health Check ==="
            curl -I --fail --connect-timeout 5 "$wpBaseURL" || { echo "wp base url: $wpBaseURL unreachable" 1>&2; exit 1; }
            curl -I --fail --connect-timeout 5 http://localhost:$WP_PORT || { echo "localhost (IPv6) unreachable" 1>&2; }
        # --------  now wp-env already sets up node but lets use this here for explicitness sake --------
        - uses: actions/setup-node@v6
          with:
            node-version: lts/*
            
        - name: Install dependencies
          run: npm ci

        - name: Install Playwright Browsers
          run: npx playwright install chrome

        - name: Run Playwright tests
          # at the github-level, might increase when tests grow...
          timeout-minutes: 5
          run: npx playwright test --reporter=list
          env:
            WP_BASE_URL: ${{ steps.wp-env-network.outputs.WP_BASE_URL }}
            DEBUG: pw:api

        - uses: actions/upload-artifact@v4
          if: ${{ !cancelled() }}
          with:
            name: playwright-report
            path: playwright-report/
            retention-days: 30
        - name: Dump WordPress debug log on failure
          if: failure()
          run: |
            CLI_CONTAINER=$(docker ps -q \
              --filter "label=com.docker.compose.service=cli" \
              --filter "name=wp-env")

            if [ -z "$CLI_CONTAINER" ]; then
              echo "CLI container not found" >&2
              exit 0
            fi

            echo "=== wp-content/debug.log ==="
            docker exec "$CLI_CONTAINER" cat wp-content/debug.log 2>/dev/null || echo "no debug.log found"

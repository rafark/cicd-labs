name: "Publish GitHub Release & Deploy tag to WordPress Repo"

on: 
  workflow_call:
    inputs:
      version: 
        #NOTE!: DO NOT USE THIS DIRECTLY IN THE STEPS BELLOW. USE THE NORMALIZED VERSION THAT STRIPS V'S
        type: string
        required: true
        description: The version to use to create the tag in the remote wp plugins repo
    secrets:
      SVN_USER: 
        required: false
      SVN_PASS: 
        required: false


defaults:
  run:
    shell: bash

# note: cannot add concurrency protections here because it clashes with build.yml


jobs: 
  build-from-tag:
    name: Build the plugin using the latest tag
    uses: ./.github/workflows/build.yml
    with:
      upload-build: true
    secrets: inherit
  setup:
      name: Prepare CI and resolve config
      needs: [build-from-tag]
      runs-on: ubuntu-latest
      outputs:
        slug: ${{ steps.setup-config.outputs.slug }}
        deploy_gh_releases: ${{ steps.setup-config.outputs.deploy_gh_releases }}
        deploy_wp_repo: ${{ steps.setup-config.outputs.deploy_wp_repo }}
      steps:
        - uses: actions/checkout@v4
        # pq requires 84.
        - name: Setup PHP 8.4 for the tooling
          uses: shivammathur/setup-php@2.37.2
          with:
            php-version: '8.4'
            coverage: none
        # --------  add the local bin to path --------
        - name: Add ~/.local/bin to the path PATH, used by some deps bellow
          run: echo "$HOME/.local/bin" >> $GITHUB_PATH
        - name: Setup slug and config from env.php
          id: setup-config
          run: |
            curl -L https://raw.githubusercontent.com/neblabs/pq/main/bin/install.sh | bash

            # ---- slug ----  
            # Do not add a fail guard. 
            # Fetching needs to be done here so should pq fail we stop the script. pq returns non-zero on invalid value or error. Since the slug is required. We need to make it fail here to halt and see what happened.
            slug=$(pq get env.php slug)
            
            
            # ---- tests ---- 
            deploy_gh_releases=$(pq get env.php deploy.github-releases || true)
            deploy_wp_repo=$(pq get env.php deploy.wordpress-repo || true)

            
            # === COMMIT === 

            echo "slug=$slug" >> "$GITHUB_OUTPUT"
            echo "deploy_gh_releases=${deploy_gh_releases:-true}" >> "$GITHUB_OUTPUT"
            echo "deploy_wp_repo=${deploy_wp_repo:-false}" >> "$GITHUB_OUTPUT"
    
  deploy-github-release:
    name: Create GitHub Release
    needs: [build-from-tag, setup]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.deploy_gh_releases == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version
        id: normalized-version
        run: |
          passedVersion="${{ inputs.version }}"
          echo "version=${passedVersion#[vV]}" >> "$GITHUB_OUTPUT"

      - name: Download plugin build artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-build
          path: plugin-build

      # --------  Setup the plugin slug --------
      - name: Package plugin zip
        run: |
          mkdir -p dist
          mkdir -p ".staging/${SLUG}"

          cp -r plugin-build/. ".staging/${SLUG}/"

          (cd .staging && zip -r "../dist/${SLUG}-${VERSION}.zip" "${SLUG}")
          rm -rf .staging

          # dump whatever to dist/
          if composer | grep -q before-gh-release; then
            composer run before-gh-release
          fi
        env:
          REPO_DIR: ${{ github.workspace }}
          BUILD_DIR: ${{ github.workspace }}/plugin-build
          DIST_DIR: ${{ github.workspace }}/dist
          VERSION: ${{ inputs.version }}
          SLUG: ${{ needs.setup.outputs.slug || github.event.repository.name }}      
      
      - name: Release with action-gh-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: v${{ steps.normalized-version.outputs.version }}
          files: "dist/*"
          generate_release_notes: false
          # Marks as prerelease if version contains a hyphen (e.g. 1.12.0-beta-1)
          prerelease: ${{ contains(inputs.version, '-') }}
  deploy-build-tag:
    name: Deploy the build to the svn plugins repo as a new tag
    needs: [build-from-tag, setup]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.deploy_wp_repo == 'true'
    steps:
      # --------  Checking out even though we are not using git tags or the plugin source code, we need the source for: the env.php and for the e2e tests which are only found on the git repo so --------
      - name: Checkout
        uses: actions/checkout@v7.0.1
      # --------  for use later by wp-env and playwright --------
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # ------------------------------------------------
      #  But first lets normalize the passed version
      # ------------------------------------------------
      - name: Normalize version
        id: normalized-version
        run: |
          passedVersion="${{ inputs.version }}"
          normalizedVersion="${passedVersion#[vV]}"

          echo "version=$normalizedVersion" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------
      #  But before everything else let's download the build
      # ------------------------------------------------
      - name: Download plugin build artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-build
          path: plugin-build # 2. Extract the built files into ./plugin-build
      - name: Verify artifact content
        run: |
          if [ ! -d "./plugin-build" ] || [ -z "$(ls -A ./plugin-build)" ]; then
            echo "::error::Artifact 'plugin-build' is empty or missing!"
            exit 1
          fi
          echo "Artifact has contents!"

          ls -la ./plugin-build
      # ------------------------------------------------
      #  Install svn
      # ------------------------------------------------
      - name: Install SVN on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
      # ------------------------------------------------
      #  Run the svn deployment
      # ------------------------------------------------
      - name: "Run wp-svn-deploy"
        env:
          SVN_USER: ${{ secrets.SVN_USER }}
          SVN_PASS: ${{ secrets.SVN_PASS }}
        run: |
          echo "::group::installing wp-svn-deploy"
          curl -L https://raw.githubusercontent.com/neblabs/wp-svn-deploy/main/install.sh | sh
          echo "::endgroup::"

          echo "::group::running wp-svn-deploy...."
          wp-svn-deploy -slug ${{ needs.setup.outputs.slug }} -build ./plugin-build -version ${{ steps.normalized-version.outputs.version }}
          echo "::endgroup::"      
      # ------------------------------------------------
      #  let's download the newly deployed tag which is the one that we'll be testing against
      # ------------------------------------------------
      - name: Fetch and setup dist dir from the new tag
        run: |
          tagDist=$(mktemp -d)/tag-dist

          svn export https://plugins.svn.wordpress.org/${{ needs.setup.outputs.slug }}/tags/${{ steps.normalized-version.outputs.version }} "$tagDist"

          # save it to the global env
          echo "TAG_DIST=$tagDist" >> "$GITHUB_ENV"
      - name: Setup wp-env config and overrides
        run: |
          # 1. Prepare base .wp-env.json
          mv .wp-env.e2e.json .wp-env.json 2>/dev/null || echo "{}" > .wp-env.json

          cat << EOF > .wp-env.override.json
          {
            "mappings": {
              "wp-content/plugins/${{ needs.setup.outputs.slug }}": "$TAG_DIST"
            },
            "config": {
              "WP_DEBUG": true,
              "WP_DEBUG_DISPLAY": false,
              "WP_DEBUG_LOG": true
            }
          }
          EOF

      # ------------------------------------------------
      #  Setup wp-env
      # ------------------------------------------------
      - name: Setup wp-env
        run: |
          # first we have to install it
          npm -g --no-fund i @wordpress/env
          # so lets boot up wp-env! with the build plugin as a mounted dependency
          wp-env start

          # since the plugin was mounted. we need to enable it. this is by design because if the plugin has other plugin dependencies, it will no be able to be installed by wp-cli.
          wp-env run cli wp plugin activate ${{ needs.setup.outputs.slug }}
      # ------------------------------------------------
      #  All right so up and running lets now just run the tests and call it a day
      # ------------------------------------------------
      - name: Extract wp env url and check network for playwright tests
        id: wp-env-network
        run: |
          # Restrict lookup strictly to wp-env's CLI container
          CLI_CONTAINER=$(docker ps -q \
            --filter "label=com.docker.compose.service=cli" \
            --filter "name=wp-env")

          if [ -z "$CLI_CONTAINER" ]; then
            echo "ERROR: Could not find wp-env CLI container" >&2
            exit 1
          fi

          # Fetch siteurl directly from the DB
          wpBaseURL=$(docker exec "$CLI_CONTAINER" wp option get siteurl)

          if [ -z "$wpBaseURL" ]; then
            echo "ERROR: Failed to retrieve siteurl from WP-CLI" >&2
            exit 1
          fi
          
          # Export WP_BASE_URL for Playwright and all subsequent steps
          echo "WP_BASE_URL=$wpBaseURL" >> $GITHUB_OUTPUT

          echo using WP_BASE_URL = "$wpBaseURL"
          echo "=== Container & Port Mappings ==="
          dockerPorts=$(docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}")

          echo "Docker ports"
          cat <<<"$dockerPorts"

          echo "=== WordPress Port Health Check ==="
          curl -I --fail --connect-timeout 5 "$wpBaseURL" || { echo "wp base url: $wpBaseURL unreachable" 1>&2; exit 1; }
          curl -I --fail --connect-timeout 5 http://localhost:$WP_PORT || { echo "localhost (IPv6) unreachable" 1>&2; }
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          
      - name: Install dependencies
        run: npm ci 
        

      - name: Install Playwright Browsers
        run: npx playwright install chrome

      - name: Run Playwright tests
        # at the github-level, might increase when tests grow...
        timeout-minutes: 5
        run: npx playwright test e2e --reporter=list,github --retries=1
        env:
          WP_BASE_URL: ${{ steps.wp-env-network.outputs.WP_BASE_URL }}
          PLUGIN_VERSION: ${{ steps.normalized-version.outputs.version }}
          DEBUG: pw:api
      # ------------------------------------------------
      #  Finally deploy new tag to trunk to make it live
      # ------------------------------------------------
      - name: Deploy new tag to trunk
        env:
            SVN_USER: ${{ secrets.SVN_USER }}
            SVN_PASS: ${{ secrets.SVN_PASS }}
        run: |
          version="${{ steps.normalized-version.outputs.version }}"
          pluginSlug="${{ needs.setup.outputs.slug }}"
          
          svnmucc \
            --username "$SVN_USER" --password "$SVN_PASS" \
            --no-auth-cache --non-interactive \
            -m "Release $version: point trunk at tags/$version" \
            -U "https://plugins.svn.wordpress.org/$pluginSlug" \
            rm trunk \
            cp HEAD "tags/$version" trunk
      - name: Dump WordPress debug log on failure
        if: failure()
        run: |
          CLI_CONTAINER=$(docker ps -q \
            --filter "label=com.docker.compose.service=cli" \
            --filter "name=wp-env")

          if [ -z "$CLI_CONTAINER" ]; then
            echo "CLI container not found" >&2
            exit 0
          fi

          echo "=== wp-content/debug.log ==="
          docker exec "$CLI_CONTAINER" cat wp-content/debug.log 2>/dev/null || echo "no debug.log found"
